[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "Nexa.py"
version = "0.5.0"
description = "Nexa.py — a Python-based web framework and development platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer",
]


[project.scripts]
nexa = "Nexa.nexa:app"

[tool.setuptools]
packages = ["Nexa", "Nexa.Core", "Nexa.LIB", "Nexa.NEXA"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
